name: Latest blog post workflow
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tistory RSS and update README
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re
          import html
          from email.utils import parsedate_to_datetime

          RSS_URL = "https://preciousstory.tistory.com/rss"
          TOP_CATEGORY = "IT"   # 이 카테고리(와 하위 카테고리)의 글만 가져옴
          POST_COUNT = 3        # 보여줄 글 개수
          THUMB_WIDTH = 64      # 썸네일 가로(px)

          req = urllib.request.Request(RSS_URL, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
          })
          with urllib.request.urlopen(req) as res:
              tree = ET.parse(res)

          def blog_category(item):
              # 첫 번째 category가 블로그 카테고리, 나머지는 태그
              for c in item.findall("category"):
                  if c.text and c.text.strip():
                      return c.text.strip()
              return ""

          def is_target(item):
              cat = blog_category(item)
              return cat == TOP_CATEGORY or cat.startswith(TOP_CATEGORY + "/")

          def sub_label(cat):
              # "IT/개발환경" -> "개발환경", "IT/개발환경/Linux" -> "개발환경 › Linux", "IT" -> "IT"
              parts = [p.strip() for p in cat.split("/")]
              return " › ".join(parts[1:]) if len(parts) > 1 else parts[0]

          def thumbnail(desc):
              # 본문에서 처음 나오는 이미지 (HEIC는 브라우저에서 안 보여서 제외)
              for src in re.findall(r'<img[^>]*?\ssrc="([^"]+)"', desc or ""):
                  if not src.lower().endswith(".heic"):
                      return html.unescape(src)
              return None

          def render_row(item):
              title = html.escape(item.findtext("title", "").strip())
              link = html.escape(item.findtext("link", "").strip(), quote=True)
              label = html.escape(sub_label(blog_category(item)))
              try:
                  date = parsedate_to_datetime(item.findtext("pubDate", "")).strftime("%Y.%m.%d")
              except (TypeError, ValueError):
                  date = ""
              meta = f"<code>{label}</code>&nbsp;<sub>{date}</sub>" if date else f"<code>{label}</code>"
              text = f'<b><a href="{link}">{title}</a></b><br>{meta}'

              thumb = thumbnail(item.findtext("description"))
              if thumb:
                  thumb = html.escape(thumb, quote=True)
                  return (f'<tr>\n<td width="{THUMB_WIDTH + 16}" align="center" valign="middle">'
                          f'<a href="{link}"><img src="{thumb}" width="{THUMB_WIDTH}" alt=""></a></td>\n'
                          f'<td valign="middle">{text}</td>\n</tr>')
              return f'<tr>\n<td colspan="2" valign="middle">{text}</td>\n</tr>'

          items = [i for i in tree.findall(".//item") if is_target(i)][:POST_COUNT]
          rows = "\n".join(render_row(i) for i in items)
          posts = f"<table>\n{rows}\n</table>" if rows else "<sub>표시할 글이 없어요.</sub>"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(
              r"<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->",
              lambda m: f"<!-- BLOG-POST-LIST:START -->\n{posts}\n<!-- BLOG-POST-LIST:END -->",
              content,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)

          print(f"README updated successfully! ({len(items)} posts)")
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update blog posts"
          git push
